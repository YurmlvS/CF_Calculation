services:
  cf-calculation-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: ${WEB_CONTAINER_NAME:-cf-calculation-web}
    ports:
      - "${WEB_PORT:-7055}:7055"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  cf-calculation-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ${API_CONTAINER_NAME:-cf-calculation-api}
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-7056}
      API_KEY: ${API_KEY:-test_api}
      FEEDBACK_DATABASE_URL: ${FEEDBACK_DATABASE_URL:-postgresql://feedback_user:feedback_password@postgres-host:5432/tools-feedback}
      FEEDBACK_DATABASE_SSL: ${FEEDBACK_DATABASE_SSL:-false}
      FEEDBACK_AUTO_INIT_TABLE: ${FEEDBACK_AUTO_INIT_TABLE:-false}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_SECRET: ${DINGTALK_SECRET:-}
    ports:
      - "${API_PORT:-7056}:${API_PORT:-7056}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
